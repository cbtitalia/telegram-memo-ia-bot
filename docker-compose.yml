version: '3.8'

services:
  telegram-obsidian-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-obsidian-bot:latest
    container_name: telegram-obsidian-bot
    env_file: .env

    environment:
      - TZ=Europe/Paris
      - LOG_LEVEL=INFO

    volumes:
      - /volume2/homes/cbtitalia/90_Memo_IA:/volume2/homes/cbtitalia/90_Memo_IA:rw
      - ./logs:/app/logs:rw

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
